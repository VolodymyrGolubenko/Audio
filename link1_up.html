<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Audio Player</title>
</head>
<body>
<script>
  // Беремо параметр ?file=...
  const params = new URLSearchParams(window.location.search);
  if (params.has("file")) {
    const url = params.get("file");
    const audio = new Audio(url);
    audio.play();
  }
</script>
</body>
</html>
